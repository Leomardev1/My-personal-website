{% extends "blog/base.html" %}

{% block shell_class %} blog-shell{% endblock %}

{% block content %}
      <main class="form-layout">
        <section class="form-card form-card-narrow">
          <p class="section-kicker">Área restrita</p>
          <h1>Login</h1>

          <form method="post" class="stack-form">
            {% csrf_token %}
            {{ form.non_field_errors }}
            {% for campo in form %}
              <div class="form-field">{{ campo.as_field_group }}</div>
            {% endfor %}
            <div class="form-actions">
              <button type="submit" class="primary-button">Entrar</button>
              <a href="{% url 'blog:post_lista' %}" class="text-button">Voltar para os posts</a>
            </div>
          </form>
        </section>
      </main>
{% endblock %}
