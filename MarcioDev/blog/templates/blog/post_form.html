{% extends "blog/base.html" %}

{% block shell_class %} blog-shell{% endblock %}

{% block content %}
      <main class="form-layout">
        <section class="form-card">
          <p class="section-kicker">Blog</p>
          <h1>Criar post</h1>

          <form method="post" class="stack-form">
            {% csrf_token %}
            {{ formulario.non_field_errors }}
            {% for campo in formulario %}
              <div class="form-field">{{ campo.as_field_group }}</div>
            {% endfor %}
            <div class="form-actions">
              <button type="submit" class="primary-button">Salvar post</button>
              <a href="{% url 'blog:post_lista' %}" class="text-button">Cancelar</a>
            </div>
          </form>
        </section>
      </main>
{% endblock %}
